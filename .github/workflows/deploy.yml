name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          provenance: false
          sbom: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yapit-client:latest

      - name: Build & Push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/user
          push: true
          provenance: false
          sbom: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yapit-user:latest

      - name: Build & Push Chat Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/chat
          push: true
          provenance: false
          sbom: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yapit-chat:latest

      - name: Build & Push Mail Service
        uses: docker/build-push-action@v6
        with:
          context: ./server/mail
          push: true
          provenance: false
          sbom: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/yapit-mail:latest

  deploy:
    needs: build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME

          script: |
            cd ~/YapIt

            git stash
            git pull origin main

            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

            export DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -af