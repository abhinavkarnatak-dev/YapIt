services:
  client:
    image: ${DOCKERHUB_USERNAME}/yapit-client:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      NODE_OPTIONS: --max-old-space-size=224
    mem_limit: 320m
    networks:
      - yapit-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  user-service:
    image: ${DOCKERHUB_USERNAME}/yapit-user:latest
    restart: unless-stopped
    env_file:
      - ./server/user/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      CHAT_SERVICE: http://chat-service:5002
      NODE_OPTIONS: --max-old-space-size=144
    mem_limit: 208m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - yapit-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chat-service:
    image: ${DOCKERHUB_USERNAME}/yapit-chat:latest
    restart: unless-stopped
    env_file:
      - ./server/chat/.env
    environment:
      USER_SERVICE: http://user-service:8080
      NODE_OPTIONS: --max-old-space-size=176
    mem_limit: 256m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "127.0.0.1:5002:5002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - yapit-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mail-service:
    image: ${DOCKERHUB_USERNAME}/yapit-mail:latest
    restart: unless-stopped
    env_file:
      - ./server/mail/.env
    environment:
      RABBITMQ_HOST: rabbitmq
      NODE_OPTIONS: --max-old-space-size=96
    mem_limit: 160m
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - yapit-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 160MiB
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - yapit-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rabbitmq-data:

networks:
  yapit-network:
    driver: bridge
